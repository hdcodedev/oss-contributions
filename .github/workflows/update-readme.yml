name: Update README from JSON config

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at 00:00 UTC

# Cancel in-progress runs for the same ref.
concurrency:
  group: update-readme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The profile repo's README shows the same stats tables, so the token
      # needs write access to it as well.
      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          repository: hdcodedev/hdcodedev
          token: ${{ secrets.OSS_CONTRIBUTIONS_TOKEN }}
          path: profile

      - name: Run generation script
        env:
          OSS_CONTRIBUTIONS_TOKEN: ${{ secrets.OSS_CONTRIBUTIONS_TOKEN }}
          PROFILE_README: profile/README.md
        run: |
          set -e
          python3 generate_readme.py

      - name: Show git diff
        run: |
          git status --porcelain
          git diff --stat

      - name: Validate generated artifacts
        run: |
          set -e
          test -s README.md || { echo "README.md is empty"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('README_DATA.json')); sys.exit(1 if not d.get('years') and not d.get('stats', {}).get('projects') else 0)" \
            || { echo "README_DATA.json is empty or invalid"; exit 1; }

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_DATA.json
          if ! git diff --cached --quiet; then
            # Only generated files change here, and a bot-pushed commit would
            # otherwise start a Tests run that waits for manual approval.
            git commit -m "docs: update contributions artifacts [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Commit and push profile README
        working-directory: profile
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update OSS contribution stats"
            git push
          else
            echo "No profile changes to commit"
          fi
